services:
  api:
    ports: !reset []
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-https://${SERVER_NAME:-localhost}}

  frontend:
    build:
      context: ./xwzx-news
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME:-_}
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy


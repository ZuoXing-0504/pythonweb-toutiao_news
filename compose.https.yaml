services:
  frontend:
    environment:
      SERVER_NAME: ${SERVER_NAME:?Set SERVER_NAME to your public domain}
    ports: !reset
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/https.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${CERTBOT_ETC_DIR:-./deploy/certbot/conf}:/etc/letsencrypt:ro


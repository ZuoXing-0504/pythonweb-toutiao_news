name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: toutiao_backend
    env:
      ASYNC_DATABASE_URL: mysql+aiomysql://user:password@127.0.0.1:3306/unused
      REDIS_URL: redis://127.0.0.1:6379/15
      DEBUG_MODE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: toutiao_backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -m "not integration" -q

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xwzx-news
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: xwzx-news/package-lock.json
      - run: npm ci
      - run: npm run build

  docker-build:
    name: Docker configuration and build
    runs-on: ubuntu-latest
    env:
      MYSQL_ROOT_PASSWORD: ci_root_password
      MYSQL_DATABASE: news_app
      MYSQL_USER: news_user
      MYSQL_PASSWORD: ci_database_password
      AI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose config --quiet
      - uses: docker/build-push-action@v6
        with:
          context: ./toutiao_backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: toutiao_backend
    env:
      ASYNC_DATABASE_URL: mysql+aiomysql://user:password@127.0.0.1:3306/unused
      REDIS_URL: redis://127.0.0.1:6379/15
      DEBUG_MODE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: toutiao_backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -m "not integration" -q

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xwzx-news
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: xwzx-news/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build

  backend-integration:
    name: MySQL and Redis integration tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: integration_root_password
          MYSQL_DATABASE: news_app_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pintegration_root_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    defaults:
      run:
        working-directory: toutiao_backend
    env:
      ASYNC_DATABASE_URL: mysql+aiomysql://root:integration_root_password@127.0.0.1:3306/news_app_test?charset=utf8mb4
      TEST_DATABASE_URL: mysql+aiomysql://root:integration_root_password@127.0.0.1:3306/news_app_test?charset=utf8mb4
      REDIS_URL: redis://127.0.0.1:6379/0
      TEST_REDIS_URL: redis://127.0.0.1:6379/1
      DEBUG_MODE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: toutiao_backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - run: python -m pytest -m integration -q

  docker-build:
    name: Docker configuration and build
    runs-on: ubuntu-latest
    env:
      MYSQL_ROOT_PASSWORD: ci_root_password
      MYSQL_DATABASE: news_app
      MYSQL_USER: news_user
      MYSQL_PASSWORD: ci_database_password
      AI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose config --quiet
      - uses: docker/build-push-action@v6
        with:
          context: ./toutiao_backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: ./xwzx-news
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
